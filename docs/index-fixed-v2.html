<script src="xlsx.min.js"></script>
<script>
// ==================== 密码 ====================
var WEB_PWD = '119119';
function checkPwd() {
  var v = document.getElementById('pwdInput').value;
  if (v === WEB_PWD) {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('mainApp').style.display = 'flex';
    document.cookie = 'key=' + WEB_PWD + ';max-age=86400;path=/';
    loadApp();
  } else {
    document.getElementById('pwdErr').style.display = 'block';
  }
}
// 检查cookie自动登录
if (document.cookie.indexOf('key=' + WEB_PWD) >= 0) {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('mainApp').style.display = 'flex';
  window.addEventListener('DOMContentLoaded', loadApp);
}

// ==================== 数据 ====================
var allProjects = [], kpiData = null, searchText = '', filterNode = null, selectedSerial = null;
var dateStart = '', dateEnd = '', stageFilter = '';
var pilotFilterAspect = ''; // 中试概览的环节筛选

function getFilteredProjects() {
  var filtered = allProjects.slice();
  if (searchText && searchText.trim()) {
    var kw = searchText.trim().toLowerCase();
    filtered = filtered.filter(function(p) { return p.name.toLowerCase().includes(kw) || p.series.toLowerCase().includes(kw) || p.person.toLowerCase().includes(kw); });
  }
  if (filterNode) {
    var today = dateEnd || new Date().toISOString().split('T')[0];
    filtered = filtered.filter(function(p) { return isNodeDelayed(p, filterNode, today); });
  }
  if (stageFilter) {
    if (stageFilter === "上市") {
      filtered = filtered.filter(function(p) { return p.dates["上市计划"] && p.dates["上市计划"] !== ""; });
    } else if (stageFilter === "送检结束" || stageFilter === "中试结束") {
      var prefix = stageFilter.replace("结束", "");
      filtered = filtered.filter(function(p) { return p.currentStage && p.currentStage.includes(prefix); });
    } else {
      filtered = filtered.filter(function(p) { return p.currentStage && p.currentStage.includes(stageFilter); });
    }
  }
  if (dateStart || dateEnd) {
    filtered = filtered.filter(function(p) {
      var plan = p.dates['送检开始计划']; if (!plan) return true;
      if (dateStart && plan < dateStart) return false;
      if (dateEnd && plan > dateEnd) return false;
      return true;
    });
  }
  return filtered;
}

function recalcKPI() {
  var filtered = getFilteredProjects();
  var today = dateEnd || new Date().toISOString().split('T')[0];
  kpiData = calcKPI(filtered, today);
}

function clean(v) { return v ? String(v).replace(/\r?\n/g,' ').trim() : ''; }
function daysBetween(d1, d2) {
  if (!d1 || !d2) return Infinity;
  var a = new Date(d1), b = new Date(d2);
  if (isNaN(a.getTime()) || isNaN(b.getTime())) return Infinity;
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}

// ==================== Excel解析 ====================
var COL={NAME:4,MODEL:5,SERIAL:0,SERIES:1,ALT_CODE:7,ALT_MODEL:8,PERSON:36,COMPLEXITY:35,DEV_METHOD:37,
  PLAN_CHECK_START:9,PLAN_CHECK_END:10,PLAN_PILOT_START:11,PLAN_PILOT_END:12,
  PLAN_PROD_START:13,PLAN_PROD_END:14,PLAN_LAUNCH:15,
  ACTUAL_CHECK_START:16,ACTUAL_CHECK_END:17,ACTUAL_PILOT_START:18,ACTUAL_PILOT_END:19,
  ACTUAL_PROD_START:20,ACTUAL_PROD_END:21,ACTUAL_LAUNCH:22,ACTUAL_CERT:23,
  MONITOR_CHECK_START:24,MONITOR_CHECK_END:25,MONITOR_PILOT_START:26,
  MONITOR_PILOT_END:27,MONITOR_PROD_START:28,MONITOR_PROD_END:29,
  CERT_STATUS:30,LAUNCH_STATUS:31,PROJECT_STATUS:32,MONITOR_FLAG:33,
  REMARK:34,CURRENT_STAGE:38,NEXT_NODE:39,NEW_STD_DATE:40,TRANSITION_END:41};
var COL2={NAME:0,ARCHIVE_COMPLETE:10,MATERIAL_COMPLETE:11,MATERIAL_NOTE:12,
  ACTUAL_FIXTURE:13,PRODUCTION_COMPLETE:14,ACTUAL_PILOT_QTY:15,
  ACTUAL_REVIEW:16,PILOT_CONCLUSION:17,POST_CONCLUSION_ISSUES:18,
  RESOLVE_PLAN_DATE:19,ACTUAL_CLOSURE:20,PRODUCT_OWNER:21};

function serialToISO(s) {
  if (!s || s < 1) return '';
  try { var d = XLSX.SSF.parse_date_code(s); return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0'); }
  catch(e) { return ''; }
}
function convertDates(arr) {
  for (var r = 0; r < arr.length; r++)
    for (var c = 0; c < arr[r].length; c++)
      if (typeof arr[r][c] === 'number' && arr[r][c] > 40000 && arr[r][c] < 100000) {
        var ds = serialToISO(arr[r][c]); if (ds) arr[r][c] = ds;
      }
}

function parseSheet2(raw) {
  var map = {};
  if (!raw || raw.length < 2) return map;
  for (var r = 1; r < raw.length; r++) {
    var n = clean(raw[r][COL2.NAME]); if (!n) continue;
    map[n] = {
      actualArchiveHW: raw[r][8]||'', actualArchiveSW: clean(raw[r][9]||''),
      archiveComplete: clean(raw[r][COL2.ARCHIVE_COMPLETE]),
      materialComplete: clean(raw[r][COL2.MATERIAL_COMPLETE]),
      materialNote: clean(raw[r][COL2.MATERIAL_NOTE]),
      actualFixture: raw[r][COL2.ACTUAL_FIXTURE]||'',
      productionComplete: clean(raw[r][COL2.PRODUCTION_COMPLETE]),
      actualPilotQty: clean(raw[r][COL2.ACTUAL_PILOT_QTY]),
      actualReview: raw[r][COL2.ACTUAL_REVIEW]||'',
      pilotConclusion: clean(raw[r][COL2.PILOT_CONCLUSION]),
      postConclusionIssues: clean(raw[r][COL2.POST_CONCLUSION_ISSUES]),
      resolvePlanDate: raw[r][COL2.RESOLVE_PLAN_DATE]||'',
      actualClosure: raw[r][COL2.ACTUAL_CLOSURE]||'',
      productOwner: clean(raw[r][COL2.PRODUCT_OWNER]),
      planArchive: raw[r][4]||'', planMaterial: raw[r][5]||'',
      planFixture: raw[r][6]||'', planPilotEnd: raw[r][7]||'',
      actualPilotDate: raw[r][2]||'', planQty: clean(raw[r][3]||'')
    };
  }
  return map;
}

function parseData(s1, s2) {
  var projects = [], pilotMap = parseSheet2(s2);
  for (var r = 1; r < s1.length; r++) {
    var name = clean(s1[r][COL.NAME]); if (!name) continue;
    var p = {
      serialNo: clean(s1[r][COL.SERIAL]), series: clean(s1[r][COL.SERIES]),
      name: name, model: clean(s1[r][COL.MODEL]), altCode: clean(s1[r][COL.ALT_CODE]), altModel: clean(s1[r][COL.ALT_MODEL]), person: clean(s1[r][COL.PERSON]),
      complexity: clean(s1[r][COL.COMPLEXITY]), devMethod: clean(s1[r][COL.DEV_METHOD]),
      dates: {
        '送检开始计划':s1[r][COL.PLAN_CHECK_START]||'','送检结束计划':s1[r][COL.PLAN_CHECK_END]||'',
        '中试开始计划':s1[r][COL.PLAN_PILOT_START]||'','中试结束计划':s1[r][COL.PLAN_PILOT_END]||'',
        '批产开始计划':s1[r][COL.PLAN_PROD_START]||'','批产结束计划':s1[r][COL.PLAN_PROD_END]||'',
        '上市计划':s1[r][COL.PLAN_LAUNCH]||'','送检开始实际':s1[r][COL.ACTUAL_CHECK_START]||'',
        '送检结束实际':s1[r][COL.ACTUAL_CHECK_END]||'','中试开始实际':s1[r][COL.ACTUAL_PILOT_START]||'',
        '中试结束实际':s1[r][COL.ACTUAL_PILOT_END]||'','批产开始实际':s1[r][COL.ACTUAL_PROD_START]||'',
        '批产结束实际':s1[r][COL.ACTUAL_PROD_END]||'','上市实际':s1[r][COL.ACTUAL_LAUNCH]||'',
        '获证实际':s1[r][COL.ACTUAL_CERT]||''
      },
      monitors: {
        '送检开始':clean(s1[r][COL.MONITOR_CHECK_START]),'送检结束':clean(s1[r][COL.MONITOR_CHECK_END]),
        '中试开始':clean(s1[r][COL.MONITOR_PILOT_START]),'中试结束':clean(s1[r][COL.MONITOR_PILOT_END]),
        '批产开始':clean(s1[r][COL.MONITOR_PROD_START]),'批产结束':clean(s1[r][COL.MONITOR_PROD_END])
      },
      projectStatus: clean(s1[r][COL.PROJECT_STATUS]), monitorFlag: s1[r][COL.MONITOR_FLAG],
      remark: clean(s1[r][COL.REMARK]), currentStage: clean(s1[r][COL.CURRENT_STAGE]),
      nextNode: clean(s1[r][COL.NEXT_NODE]),
      isLPCB: name.toUpperCase().includes('LPCB'),
      isCooperative: (s1[r][COL.MONITOR_FLAG] === 0 || s1[r][COL.MONITOR_FLAG] === '0'),
      pilotDetail: null
    };
    if (pilotMap[name]) p.pilotDetail = pilotMap[name];
    else { for (var k in pilotMap) { if (name.includes(k) || k.includes(name)) { p.pilotDetail = pilotMap[k]; break; } } }
    projects.push(p);
  }
  return projects;
}

// ==================== KPI ====================
var KPI_NODES=['送检开始','送检结束','中试开始'];
var NODE_PLAN={'送检开始':'送检开始计划','送检结束':'送检结束计划','中试开始':'中试开始计划'};
var NODE_ACTUAL={'送检开始':'送检开始实际','送检结束':'送检结束实际','中试开始':'中试开始实际'};
var STAGE_TO_PLAN={'送检':'送检开始计划','送检开始':'送检开始计划','送检结束':'送检结束计划','中试':'中试开始计划','中试开始':'中试开始计划','中试结束':'中试结束计划','上市':'上市计划'};var ACTUAL_MAP={'送检':'送检开始实际','送检开始':'送检开始实际','送检结束':'送检结束实际','中试':'中试开始实际','中试开始':'中试开始实际','中试结束':'中试结束实际','上市':'上市实际'};

function isNodeDelayed(p, node, today) {
  var plan=p.dates[NODE_PLAN[node]], actual=p.dates[NODE_ACTUAL[node]];
  if (actual) return false;
  if (!plan) return p.monitors[node]==='逾期未完成';
  var past=daysBetween(plan, today);
  if (past===Infinity) return p.monitors[node]==='逾期未完成';
  return past>0;
}

function calcKPI(projects, today) {
  if (!today) { var now=new Date(); today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0'); }
  var monitored=projects.filter(function(p){
    if (p.projectStatus==='完成'||p.projectStatus==='提前完成') return false;
    if (p.isLPCB) return false;
    if (p.isCooperative) return false;
    var dp=daysBetween(today, p.dates['送检开始计划']);
    return (dp>=0&&dp<=30)||!!p.dates['送检开始实际'];
  });
  var delayed=0, bd={};
  for (var i=0;i<KPI_NODES.length;i++) bd[KPI_NODES[i]]={delayed:0};
  for (var j=0;j<monitored.length;j++) {
    var d=false;
    for (var k=0;k<KPI_NODES.length;k++) {
      if (isNodeDelayed(monitored[j],KPI_NODES[k],today)) { bd[KPI_NODES[k]].delayed++; d=true; }
    }
    if (d) delayed++;
  }
  var rate=monitored.length>0?(1-delayed/monitored.length):0;
  return {onTimeRate:Math.round(rate*10000)/100,onTimeRateDisplay:(Math.round(rate*1000)/10).toFixed(1)+'%',delayedCount:delayed,totalCount:monitored.length,nodeBreakdown:bd};
}

// ==================== 排序 ====================
function sortProjects(projects) {
  var today=new Date().toISOString().split("T")[0];
  var planKey=(typeof STAGE_TO_PLAN!=="undefined"&&stageFilter)?STAGE_TO_PLAN[stageFilter]:null;
  var actualKey=(typeof ACTUAL_MAP!=="undefined"&&stageFilter)?ACTUAL_MAP[stageFilter]:null;
  projects.forEach(function(p){
    var urgency;
    if(planKey&&p.dates[planKey]){
      if(actualKey&&p.dates[actualKey]){
        urgency={days:Infinity,label:"已完成"};
      }else{
        var d=daysBetween(today,p.dates[planKey]);
        if(d<0)urgency={days:d,label:"超期"+Math.abs(d)+"天"};
        else if(d>0)urgency={days:d,label:"还有"+d+"天"};
        else urgency={days:Infinity,label:"今天到期"};
      }
    }else{
      urgency=extractDaysFromNode(p.nextNode);
    }
    p._urgencyDays=urgency.days;
    p._urgencyLabel=urgency.label;
    p._urgencyLevel=getUrgencyLevel(urgency.days);
    if(p.projectStatus==="完成"||p.projectStatus==="提前完成"){
      p._urgencyDays=Infinity;
      p._urgencyLabel=p.projectStatus;
      p._urgencyLevel="completed";
    }
  });
  projects.sort(function(a,b){return a._urgencyDays-b._urgencyDays||a.name.localeCompare(b.name,"zh-CN");});
  return projects;
}
